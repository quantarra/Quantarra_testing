name: QA Automation

on:
  # No scheduled run — trigger manually from the Actions tab when needed.
  # (The daily shakeout is scheduled in .github/workflows/daily-shakeout.yml at 10:00 AM IST.)

  # Manual trigger (from this repo's Actions tab)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - poc
          - prod
        default: staging
      scenario:
        description: 'Test scenario to run'
        required: true
        type: choice
        options:
          - 'Daily Shakeout (Excel-driven)'
          - 'Regression (Excel-driven)'
          - 'Scenario 1 - Authentication Flow'
          - 'Scenario 2 - Navigation Workspace (Admin)'
          - 'Scenario 3 - Navigation Workspace (Contributor)'
          - 'Scenario 4 - Admin Tab'
          - 'Scenario 5 - Audit Lifecycle Create'
          - 'Scenario 6 - Audit Lifecycle Existing'
          - 'All - API Tests (Auth, Users, Frameworks, Audits, Policies, Evidence)'
          - 'Console Error Monitor'
          - 'All'
        default: 'Daily Shakeout (Excel-driven)'
      framework:
        description: 'Framework type (only used with "Scenario 5 - Audit Lifecycle Create")'
        required: false
        type: choice
        options:
          - N/A
          - SOC 2 Type 2
          - SOC 2 Type 1
          - ISO IEC 27001
          - ISO IEC 27701:2025
          - CyberFundamentals 2.0
          - CyFun (CyberFundamentals)
          - CIS v8.1 (Center for Internet Security) Version 8
          - CIS v8 (Center for Internet Security) Version 8
          - HIPAA
          - SOX (Sarbanes-Oxley)
          - FERPA (Family Educational Rights and Privacy Act)
          - NOM-035-STPS-2018
          - NJ MVC Technology Questionnaire
          - Risk Assessment
          - Custom 2
        default: 'N/A'

  # Reusable workflow trigger (called from other repos' pipelines)
  workflow_call:
    inputs:
      environment:
        description: 'Target environment (staging, poc, or prod)'
        required: true
        type: string
      scenario:
        description: 'Test scenario to run'
        required: false
        type: string
        default: 'Daily Shakeout (Excel-driven)'
      framework:
        description: 'Framework type for audit creation tests'
        required: false
        type: string
        default: 'N/A'
    outputs:
      test_result:
        description: 'Overall test result (passed/failed)'
        value: ${{ jobs.test.outputs.result }}
      tests_passed:
        description: 'Number of tests passed'
        value: ${{ jobs.test.outputs.passed }}
      tests_failed:
        description: 'Number of tests failed'
        value: ${{ jobs.test.outputs.failed }}
    secrets:
      ADMIN_PASSWORD:
        required: false
      CONTRIBUTOR_PASSWORD:
        required: false
      MC_ADMIN_PASSWORD:
        required: false
      JIRA_API_TOKEN:
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      result: ${{ steps.outcome.outputs.result }}
      passed: ${{ steps.outcome.outputs.passed }}
      failed: ${{ steps.outcome.outputs.failed }}

    env:
      ENV: ${{ inputs.environment || 'staging' }}
      FRAMEWORK_TYPE: ${{ inputs.framework || 'N/A' }}
      TEST_SCENARIO: ${{ inputs.scenario || 'Daily Shakeout (Excel-driven)' }}
      # --- Credentials ---
      # IMPORTANT: Do NOT set unprefixed *_EMAIL vars here. They would override
      # the per-environment emails in config/environments.json (environment.ts
      # prioritises process.env over the JSON), causing POC/Prod runs to log in
      # with the STAGING account. Emails are resolved per-env from the JSON.
      # Only passwords/tokens (shared across envs) are injected as secrets.
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'Quantarra2026!' }}
      CONTRIBUTOR_PASSWORD: ${{ secrets.CONTRIBUTOR_PASSWORD || 'Quantarra2026!' }}
      MC_ADMIN_PASSWORD: ${{ secrets.MC_ADMIN_PASSWORD || 'Quantarra2026!' }}
      # --- URLs ---
      STAGING_BASE_URL: https://stg.quantarra.com
      STAGING_MC_URL: https://stg.quantarra.com:4002
      STAGING_AUDIT_URL: https://stg.quantarra.com:4003
      STAGING_API_URL: https://stg.quantarra.com/api/v1
      POC_BASE_URL: https://poc.quantarra.com
      POC_MC_URL: https://mc.poc.quantarra.com
      # NOTE: POC audit portal may not be deployed yet.
      POC_AUDIT_URL: https://audit-poc.quantarra.com
      POC_API_URL: https://poc.quantarra.com/api/v1
      PROD_BASE_URL: https://app.quantarra.com
      PROD_MC_URL: https://mc.quantarra.com
      PROD_AUDIT_URL: https://audit.quantarra.com
      PROD_API_URL: https://app.quantarra.com/api/v1
      # --- Jira ---
      JIRA_BASE_URL: https://quantarra.atlassian.net
      JIRA_EMAIL: keerthi@quantarra.io
      JIRA_PROJECT_KEY: PRJAT
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN || '' }}

    steps:
      - name: Checkout QA automation code
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Automation/package-lock.json

      - name: Install dependencies
        working-directory: Automation
        run: npm ci

      - name: Install Playwright browsers
        working-directory: Automation
        run: npx playwright install chromium --with-deps

      - name: Run tests
        id: run-tests
        working-directory: Automation
        run: |
          SCENARIO="${{ inputs.scenario || 'Daily Shakeout (Excel-driven)' }}"
          
          echo "🎯 Environment: $ENV"
          echo "🎯 Scenario: $SCENARIO"
          echo "🎯 Framework: $FRAMEWORK_TYPE"
          echo ""
          
          # Map scenario input to test file/grep pattern
          case "$SCENARIO" in
            "Daily Shakeout (Excel-driven)")
              echo "Running: Daily Shakeout — Excel-driven (reads New_Testcase.xlsx for inclusion)"
              npx playwright test --project=daily-shakeout --retries=1
              ;;
            "Regression (Excel-driven)")
              echo "Running: Regression — Excel-driven (reads 'Run for Full regression' column)"
              RUN_MODE=regression npx playwright test --project=regression --retries=1
              ;;
            "Scenario 1 - Authentication Flow")
              echo "Running: Scenario 1 — Authentication Flow"
              npx playwright test tests/smoke-suite/tg1-tg3-authentication.spec.ts --project=smoke-suite --retries=1 --grep "Scenario 1"
              ;;
            "Scenario 2 - Navigation Workspace (Admin)")
              echo "Running: Scenario 2 — Navigation Workspace (Admin)"
              npx playwright test tests/smoke-suite/tg1-tg3-authentication.spec.ts --project=smoke-suite --retries=1 --grep "Scenario 2"
              ;;
            "Scenario 3 - Navigation Workspace (Contributor)")
              echo "Running: Scenario 3 — Navigation Workspace (Contributor)"
              npx playwright test tests/smoke-suite/tg1-tg3-authentication.spec.ts --project=smoke-suite --retries=1 --grep "Scenario 3"
              ;;
            "Scenario 4 - Admin Tab")
              echo "Running: Scenario 4 — Admin Tab"
              npx playwright test tests/smoke-suite/tg5-admin.spec.ts --project=smoke-suite --retries=1
              ;;
            "Scenario 5 - Audit Lifecycle Create")
              echo "Running: Scenario 5 — Audit Lifecycle Create"
              npx playwright test tests/smoke-suite/tg6-audit-lifecycle.spec.ts --project=smoke-suite --retries=1
              ;;
            "Scenario 6 - Audit Lifecycle Existing")
              echo "Running: Scenario 6 — Audit Lifecycle Existing"
              npx playwright test tests/smoke-suite/tg6-audit-search.spec.ts tests/smoke-suite/tg6-audit-dashboard.spec.ts --project=smoke-suite --retries=1
              ;;
            "All - API Tests (Auth, Users, Frameworks, Audits, Policies, Evidence)")
              echo "Running: All API Tests"
              npx playwright test --project=api-suite --retries=1
              ;;
            "Console Error Monitor")
              echo "Running: Console Error Monitor"
              npx playwright test tests/smoke-suite/console-error-monitor.spec.ts --project=smoke-suite --retries=0 --timeout=180000
              ;;
            "All")
              echo "Running: ALL test suites"
              npx playwright test --project=daily-shakeout --project=smoke-suite --project=api-suite --retries=1
              ;;
            *)
              echo "⚠️ Unknown scenario: $SCENARIO — running Daily Shakeout"
              npx playwright test --project=daily-shakeout --retries=1
              ;;
          esac

      - name: Capture test outcome
        id: outcome
        if: always()
        working-directory: Automation
        run: |
          if [ -f reports/results.json ]; then
            PASSED=$(cat reports/results.json | jq '.stats.expected // 0')
            FAILED=$(cat reports/results.json | jq '.stats.unexpected // 0')
            SKIPPED=$(cat reports/results.json | jq '.stats.skipped // 0')
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
            if [ "$FAILED" -eq "0" ]; then
              echo "result=passed" >> $GITHUB_OUTPUT
            else
              echo "result=failed" >> $GITHUB_OUTPUT
            fi
          else
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=1" >> $GITHUB_OUTPUT
            echo "skipped=0" >> $GITHUB_OUTPUT
            echo "result=failed" >> $GITHUB_OUTPUT
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-${{ inputs.environment || 'staging' }}-${{ github.run_number }}
          path: |
            Automation/reports/html/
            Automation/reports/results.json
          retention-days: 30

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-screenshots-${{ github.run_number }}
          path: Automation/reports/artifacts/**/*.png
          retention-days: 14
          if-no-files-found: ignore

      - name: Test Summary
        if: always()
        working-directory: Automation
        run: |
          echo "## QA Automation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | **${{ inputs.environment || 'staging' }}** |" >> $GITHUB_STEP_SUMMARY
          echo "| Scenario | **${{ inputs.scenario || 'Daily Shakeout (Excel-driven)' }}** |" >> $GITHUB_STEP_SUMMARY
          echo "| Framework | ${{ inputs.framework || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f reports/results.json ]; then
            PASSED=$(cat reports/results.json | jq '.stats.expected // 0')
            FAILED=$(cat reports/results.json | jq '.stats.unexpected // 0')
            SKIPPED=$(cat reports/results.json | jq '.stats.skipped // 0')
            DURATION=$(cat reports/results.json | jq '(.stats.duration // 0) / 1000 | floor')
            echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏭️ Skipped | $SKIPPED |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏱️ Duration | ${DURATION}s |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📋 *Test inclusion controlled by \`tests/New_Testcase.xlsx\` → \"Run Shakeout in Prod and POC\" column*" >> $GITHUB_STEP_SUMMARY
