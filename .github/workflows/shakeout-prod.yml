name: Shakeout - Prod Env.

on:
  schedule:
    # 10:30 AM IST = 05:00 UTC — daily (staggered 30 min after POC to avoid overlap)
    - cron: '0 5 * * *'
  workflow_dispatch:

  # Reusable workflow trigger — allows other repos in the 'quantarra' org
  # (e.g. quantarra/project-atlas) to run the Prod shakeout via `uses:`.
  # The caller must pass `secrets: inherit` so the secrets.* refs below resolve.
  workflow_call:
    secrets:
      JIRA_API_TOKEN:
        required: false
      SMTP_HOST:
        required: false
      SMTP_PORT:
        required: false
      SMTP_USER:
        required: false
      SMTP_PASSWORD:
        required: false
      SHAKEOUT_REPORT_RECIPIENTS:
        required: false
      SLACK_WEBHOOK_URL:
        required: false
      JIRA_EMAIL:
        required: false

env:
  # Environment URLs (also in config/environments.json — env vars override if set)
  PROD_BASE_URL: https://app.quantarra.com
  PROD_MC_URL: https://mc.quantarra.com
  PROD_AUDIT_URL: https://audit.quantarra.com
  PROD_API_URL: https://app.quantarra.com/api/v1

  # Jira (token is the only real secret — rest is in environments.json)
  JIRA_BASE_URL: https://quantarra.atlassian.net
  JIRA_PROJECT_KEY: PRJAT
  JIRA_EMAIL: keerthi@quantarra.io
  JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

  # Email (SMTP password is the only real secret)
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_PORT: ${{ secrets.SMTP_PORT }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  REPORT_RECIPIENTS: ${{ secrets.SHAKEOUT_REPORT_RECIPIENTS }}

jobs:
  shakeout-prod:
    name: Shakeout — Prod
    runs-on: ubuntu-latest
    steps:
      # Always check out THIS repo (the QA test code), even when the workflow
      # is called from another repo (e.g. quantarra/project-atlas). Without an
      # explicit repository the reusable workflow would check out the CALLER,
      # which has no Automation/ folder or lockfile → setup-node cache fails with
      # "Some specified paths were not resolved, unable to cache dependencies".
      - uses: actions/checkout@v5
        with:
          repository: quantarra/Quantarra_testing
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Automation/package-lock.json

      - name: Install dependencies
        working-directory: Automation
        run: npm ci

      - name: Install Playwright browsers
        working-directory: Automation
        run: npx playwright install chromium --with-deps

      - name: Run Daily Shakeout — Prod
        working-directory: Automation
        env:
          ENV: prod
          PLAYWRIGHT_JSON_OUTPUT_FILE: reports/results.json
        run: npx playwright test --project=daily-shakeout --reporter=list,json,html || true

      - name: Upload Prod results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shakeout-prod-results
          path: Automation/reports/results.json
          retention-days: 30

      - name: Upload Prod screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shakeout-prod-screenshots
          path: Automation/reports/artifacts/
          retention-days: 7

  report-and-notify:
    name: Consolidate Report & Notify
    runs-on: ubuntu-latest
    needs: [shakeout-prod]
    if: always()
    steps:
      # Same reason as above — check out the QA repo, not the caller.
      - uses: actions/checkout@v5
        with:
          repository: quantarra/Quantarra_testing
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Automation/package-lock.json

      - name: Install dependencies
        working-directory: Automation
        run: npm ci

      - name: Download Prod results
        if: ${{ needs.shakeout-prod.result == 'success' || needs.shakeout-prod.result == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          name: shakeout-prod-results
          path: Automation/reports/prod
        continue-on-error: true

      - name: Generate consolidated report & notify
        working-directory: Automation
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_RECIPIENTS: ${{ secrets.SHAKEOUT_REPORT_RECIPIENTS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: npx tsx scripts/shakeout-notify.ts
