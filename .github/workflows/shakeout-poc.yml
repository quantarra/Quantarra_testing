name: Shakeout - POC Env.

on:
  schedule:
    # 10:00 AM IST = 04:30 UTC — daily
    - cron: '30 4 * * *'
  workflow_dispatch:

env:
  # Environment URLs (also in config/environments.json — env vars override if set)
  POC_BASE_URL: https://poc.quantarra.com
  POC_MC_URL: https://poc.quantarra.com:4002
  POC_AUDIT_URL: https://poc.quantarra.com:4003
  POC_API_URL: https://poc.quantarra.com/api/v1

  # Jira (token is the only real secret — rest is in environments.json)
  JIRA_BASE_URL: https://quantarra.atlassian.net
  JIRA_PROJECT_KEY: PRJAT
  JIRA_EMAIL: keerthi@quantarra.io
  JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

  # Email (SMTP password is the only real secret)
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_PORT: ${{ secrets.SMTP_PORT }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  REPORT_RECIPIENTS: ${{ secrets.SHAKEOUT_REPORT_RECIPIENTS }}

jobs:
  shakeout-poc:
    name: Shakeout — POC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Automation/package-lock.json

      - name: Install dependencies
        working-directory: Automation
        run: npm ci

      - name: Install Playwright browsers
        working-directory: Automation
        run: npx playwright install chromium --with-deps

      - name: Run Daily Shakeout — POC
        working-directory: Automation
        env:
          ENV: poc
          PLAYWRIGHT_JSON_OUTPUT_FILE: reports/results.json
        run: npx playwright test --project=daily-shakeout --reporter=list,json,html || true

      - name: Upload POC results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shakeout-poc-results
          path: Automation/reports/results.json
          retention-days: 30

      - name: Upload POC screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shakeout-poc-screenshots
          path: Automation/reports/artifacts/
          retention-days: 7

  report-and-notify:
    name: Consolidate Report & Notify
    runs-on: ubuntu-latest
    needs: [shakeout-poc]
    if: always()
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Automation/package-lock.json

      - name: Install dependencies
        working-directory: Automation
        run: npm ci

      - name: Download POC results
        if: ${{ needs.shakeout-poc.result == 'success' || needs.shakeout-poc.result == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          name: shakeout-poc-results
          path: Automation/reports/poc
        continue-on-error: true

      - name: Generate consolidated report & notify
        working-directory: Automation
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_RECIPIENTS: ${{ secrets.SHAKEOUT_REPORT_RECIPIENTS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: npx tsx scripts/shakeout-notify.ts
